<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ONG Esperança - Cadastro</title>
  </head>

  <body>
    <header>
      <h1>ONG Esperança</h1>

      <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="projeto.html">Projetos Sociais</a>
        <a href="cadastro.html">Seja um colaborador</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Seja um colaborador</h2>

        <p>
          Preencha seus dados para fazer parte da rede de colaboradores da ONG
          Esperança.
        </p>

        <img
          src="assets/ChatGPT Image 24 de set. de 2026, 21_01_42.png"
          alt="Pessoa realizando cadastro para participar de uma ONG"
        />
      </section>

      <form action="#" method="post">
        <fieldset>
          <legend>Dados pessoais</legend>

          <p>
            <label for="nome">Nome completo:</label>
            <input
              type="text"
              id="nome"
              name="nome"
              required
              minlength="3"
              maxlength="100"
              autocomplete="name"
            />
          </p>

          <p>
            <label for="email">E-mail:</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
            />
          </p>

          <p>
            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required />
          </p>

          <p>
            <label for="cpf">CPF:</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              required
              pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$"
              maxlength="14"
              placeholder="000.000.000-00"
              title="Digite o CPF no formato 000.000.000-00"
            />
          </p>
        </fieldset>

        <fieldset>
          <legend>Contato</legend>

          <p>
            <label for="telefone">Telefone:</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              required
              pattern="^\(\d{2}\) \d{5}-\d{4}$"
              maxlength="15"
              placeholder="(83) 99999-9999"
              title="Digite o telefone no formato (83) 99999-9999"
              autocomplete="tel"
            />
          </p>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <p>
            <label for="cep">CEP:</label>
            <input
              type="text"
              id="cep"
              name="cep"
              required
              pattern="^\d{5}-\d{3}$"
              maxlength="9"
              placeholder="00000-000"
              title="Digite o CEP no formato 00000-000"
              autocomplete="postal-code"
            />
          </p>

          <p>
            <label for="cidade">Cidade:</label>
            <input
              type="text"
              id="cidade"
              name="cidade"
              required
              maxlength="60"
              autocomplete="address-level2"
            />
          </p>

          <p>
            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
              <option value="">Selecione</option>
              <option value="PB">Paraíba</option>
              <option value="PE">Pernambuco</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="CE">Ceará</option>
              <option value="AL">Alagoas</option>
              <option value="BA">Bahia</option>
            </select>
          </p>
        </fieldset>

        <button type="submit">Cadastrar</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
